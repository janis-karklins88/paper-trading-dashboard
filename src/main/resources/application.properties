spring.application.name=paper-trading-dashboard

spring.datasource.url=jdbc:postgresql://localhost:5432/paper_trading_dashboard
spring.datasource.username=paper_user
spring.datasource.password=paper_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:replace-this-dev-secret-with-at-least-32-bytes}
app.jwt.expiration-ms=86400000
