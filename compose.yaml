services:
  postgres:
    image: postgres:16
    container_name: paper-trading-postgres
    environment:
      POSTGRES_DB: paper_trading_dashboard
      POSTGRES_USER: paper_user
      POSTGRES_PASSWORD: paper_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
